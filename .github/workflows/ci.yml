name: CI

on:
  push:
    branches: [ main, add-ci ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t f1project:ci .

      # building isn't enough, the container should actually come up
      - name: Check the app starts
        run: |
          docker run -d --name f1 -p 8501:8501 f1project:ci
          sleep 15
          curl -f http://localhost:8501/_stcore/health
          docker stop f1
